name: Astro preview artifact

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check Astro source
        run: bun run check
      - name: Build Astro preview
        run: bun run build
      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: astro-preview
          path: dist
          if-no-files-found: error
